<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-192x192.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15171a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="스마트 계산기" />
    <meta name="description" content="연복리, 단위 변환, 환율 등 일상과 금융 생활을 위한 스마트 멀티 계산기 플랫폼" />
    <meta name="author" content="sosoFactory" />
    <title>스마트 계산기 허브 | Smart Calculator Hub</title>
    <!-- Pretendard Variable 웹폰트 (숫자 및 한글 전면 적용) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme-preference');
          var isDark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#0f172a] text-[#112220] dark:text-slate-100 antialiased font-sans selection:bg-[#d1ff19] selection:text-[#112220]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
