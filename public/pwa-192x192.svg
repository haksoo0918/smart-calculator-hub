<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512">
  <defs>
    <!-- Full Bleed Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181b20" />
      <stop offset="100%" stop-color="#111316" />
    </linearGradient>
    
    <!-- Calculator Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242a34" />
      <stop offset="100%" stop-color="#1c2027" />
    </linearGradient>

    <!-- Key Button Gradient -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f3643" />
      <stop offset="100%" stop-color="#252b35" />
    </linearGradient>

    <!-- Electric Lime Equals Key Gradient -->
    <linearGradient id="limeKeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dbff33" />
      <stop offset="100%" stop-color="#c2f00d" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Full Bleed Background Canvas -->
  <rect width="192" height="192" fill="url(#bgGrad)" />

  <!-- Calculator Main Body (Centered in Safe Zone) -->
  <rect x="104" y="88" width="304" height="336" rx="44" ry="44" fill="url(#bodyGrad)" stroke="#333b49" stroke-width="2" filter="url(#shadow)" />

  <!-- Upper Screen Display -->
  <rect x="136" y="122" width="240" height="56" rx="14" ry="14" fill="#111419" stroke="#282f3a" stroke-width="1.5" />
  
  <!-- Digital Screen Mockup Indicators -->
  <circle cx="156" cy="150" r="4" fill="#d1ff19" opacity="0.9" />
  <rect x="172" y="147" width="32" height="6" rx="3" fill="#d1ff19" opacity="0.8" />
  <rect x="306" y="140" width="54" height="20" rx="4" fill="#ffffff" opacity="0.95" />

  <!-- Keypad 2x2 Grid -->
  <!-- Top Left: Plus (+) -->
  <rect x="142" y="206" width="96" height="80" rx="20" ry="20" fill="url(#keyGrad)" stroke="#384050" stroke-width="1" />
  <path d="M190 231 v30 M175 246 h30" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />

  <!-- Top Right: Minus (-) -->
  <rect x="274" y="206" width="96" height="80" rx="20" ry="20" fill="url(#keyGrad)" stroke="#384050" stroke-width="1" />
  <path d="M307 246 h30" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />

  <!-- Bottom Left: Multiply (x) -->
  <rect x="142" y="312" width="96" height="80" rx="20" ry="20" fill="url(#keyGrad)" stroke="#384050" stroke-width="1" />
  <path d="M179 341 L201 363 M201 341 L179 363" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />

  <!-- Bottom Right: Equals (=) with Electric Lime Accent -->
  <rect x="274" y="312" width="96" height="80" rx="20" ry="20" fill="url(#limeKeyGrad)" stroke="#d1ff19" stroke-width="1.5" />
  <path d="M307 346 h30 M307 358 h30" stroke="#15171a" stroke-width="6" stroke-linecap="round" />
</svg>
