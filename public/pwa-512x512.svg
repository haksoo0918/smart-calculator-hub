<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="screenGrad512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  
  <!-- Calculator Body -->
  <rect x="96" y="80" width="320" height="352" rx="52" fill="#ffffff" opacity="0.95" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.18))"/>
  
  <!-- Calculator Display / Chart Area -->
  <rect x="128" y="118" width="256" height="90" rx="20" fill="url(#screenGrad512)"/>
  
  <!-- Mini Trend Graph inside Display -->
  <path d="M148 178 L196 156 L244 170 L294 140 L344 135" fill="none" stroke="#0d9488" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="344" cy="135" r="8" fill="#0d9488"/>

  <!-- Keypad Grid -->
  <!-- Row 1 -->
  <circle cx="166" cy="262" r="24" fill="#f1f5f9"/>
  <circle cx="256" cy="262" r="24" fill="#f1f5f9"/>
  <circle cx="346" cy="262" r="24" fill="#0d9488"/>
  <text x="346" y="272" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">÷</text>

  <!-- Row 2 -->
  <circle cx="166" cy="326" r="24" fill="#f1f5f9"/>
  <circle cx="256" cy="326" r="24" fill="#f1f5f9"/>
  <circle cx="346" cy="326" r="24" fill="#0d9488"/>
  <text x="346" y="336" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">×</text>

  <!-- Row 3 -->
  <circle cx="166" cy="390" r="24" fill="#f1f5f9"/>
  <circle cx="256" cy="390" r="24" fill="#f1f5f9"/>
  <circle cx="346" cy="390" r="24" fill="#0f766e"/>
  <text x="346" y="400" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">=</text>
</svg>
